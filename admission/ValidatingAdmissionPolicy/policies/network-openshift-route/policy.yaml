apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: route-no-tls
  annotations:
    security.kubeapt.io/displayName: "OpenShift Route No TLS"
    security.kubeapt.io/description: "A Route without a TLS section is published over plain HTTP at the router, so session cookies and credentials cross the network in cleartext and can be read or rewritten in transit."
    security.kubeapt.io/resource: "Routes"
    security.kubeapt.io/severity: "High"
    security.kubeapt.io/remediation: "Add a spec.tls block using edge, reencrypt or passthrough termination so the router serves the host over HTTPS. Field: spec.tls."
    security.kubeapt.io/product: "OpenShift"
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
    - apiGroups:
      - route.openshift.io
      apiVersions:
      - v1
      operations:
      - CREATE
      - UPDATE
      resources:
      - routes
  validations:
  - expression: |
      has(object.spec.tls)
    message: |
      OpenShift Routes must define TLS termination (spec.tls).
