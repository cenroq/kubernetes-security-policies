apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: serviceaccount-imagepullsecrets-scope
  annotations:
    cenroq.io/finding: "oq-0432"
    cenroq.io/kubernetes-version-min: "1.27"
    security.kubeapt.io/displayName: "Attaches More Than One Image Pull Secret"
    security.kubeapt.io/description: "Attaching several registry credentials to one ServiceAccount hands all of them to every pod that uses it, so one compromised workload exposes registry logins it never needed to pull its own image."
    security.kubeapt.io/resource: "ServiceAccounts"
    security.kubeapt.io/severity: "Moderate"
    security.kubeapt.io/remediation: "Reduce the ServiceAccount to at most one imagePullSecret and create separate ServiceAccounts for workloads that need a different registry. Field: imagePullSecrets."
    security.kubeapt.io/product: "Kubernetes"
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
    - apiGroups:
      - ''
      apiVersions:
      - v1
      operations:
      - CREATE
      - UPDATE
      resources:
      - serviceaccounts
  validations:
  - expression: |
      !has(object.imagePullSecrets) || size(object.imagePullSecrets) <= 1
    message: |
      Limit imagePullSecrets on ServiceAccounts; avoid sharing powerful registry creds broadly.
