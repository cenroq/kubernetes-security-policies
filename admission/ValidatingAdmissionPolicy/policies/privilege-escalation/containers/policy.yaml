apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: allow-privilege-escalation-containers
  annotations:
    security.kubeapt.io/displayName: "Privilege Escalation"
    security.kubeapt.io/description: "Leaving privilege escalation enabled lets a process in the container gain more privileges than its parent through setuid binaries or file capabilities, turning a compromised unprivileged process into root inside the container."
    security.kubeapt.io/resource: "Containers"
    security.kubeapt.io/severity: "Critical"
    security.kubeapt.io/remediation: "Set allowPrivilegeEscalation to false in the security context of every container. The field must be present explicitly, since omitting it also fails. Field: spec.containers[*].securityContext.allowPrivilegeEscalation."
    security.kubeapt.io/product: "Kubernetes"
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
    - apiGroups:
      - ''
      apiVersions:
      - v1
      operations:
      - CREATE
      - UPDATE
      resources:
      - pods
  validations:
  - expression: |
      (has(object.spec.os) &&
       has(object.spec.os.name) &&
       object.spec.os.name.lowerAscii() == "windows") ||
      object.spec.containers.all(c,
        has(c.securityContext) &&
        has(c.securityContext.allowPrivilegeEscalation) &&
        c.securityContext.allowPrivilegeEscalation == false
      )
    message: |
      spec.containers[*].securityContext.allowPrivilegeEscalation must be set to false.
