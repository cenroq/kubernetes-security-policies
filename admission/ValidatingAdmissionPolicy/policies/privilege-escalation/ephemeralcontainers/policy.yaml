apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: allow-privilege-escalation-ephemeralcontainers
  annotations:
    security.kubeapt.io/displayName: "Privilege Escalation"
    security.kubeapt.io/description: "Leaving privilege escalation enabled lets a process in the ephemeral container gain more privileges than its parent through setuid binaries or file capabilities, turning a compromised unprivileged process into root inside the container."
    security.kubeapt.io/resource: "Ephemeralcontainers"
    security.kubeapt.io/severity: "Critical"
    security.kubeapt.io/remediation: "Set allowPrivilegeEscalation to false in the security context of every ephemeral container. The field must be present explicitly, since omitting it also fails. Field: spec.ephemeralContainers[*].securityContext.allowPrivilegeEscalation."
    security.kubeapt.io/product: "Kubernetes"
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
    - apiGroups:
      - ''
      apiVersions:
      - v1
      operations:
      - CREATE
      - UPDATE
      resources:
      - pods/ephemeralcontainers
  validations:
  - expression: |
      (has(object.spec.os) &&
       has(object.spec.os.name) &&
       object.spec.os.name.lowerAscii() == "windows") ||
      !has(object.spec.ephemeralContainers) || object.spec.ephemeralContainers.all(ec,
        has(ec.securityContext) &&
        has(ec.securityContext.allowPrivilegeEscalation) &&
        ec.securityContext.allowPrivilegeEscalation == false
      )
    message: |
      spec.ephemeralContainers[*].securityContext.allowPrivilegeEscalation must be set to false.
