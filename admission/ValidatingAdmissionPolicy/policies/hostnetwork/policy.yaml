apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: hostnetwork
  annotations:
    security.kubeapt.io/displayName: "Hostnetwork"
    security.kubeapt.io/description: "Host networking removes network namespace isolation, letting the workload sniff all node traffic, bind directly to node ports and reach loopback-bound node services such as the kubelet and local metadata proxies."
    security.kubeapt.io/resource: "Pods"
    security.kubeapt.io/severity: "Critical"
    security.kubeapt.io/remediation: "Remove spec.hostNetwork or set it to false and expose the workload through a Service instead. Field: spec.hostNetwork."
    security.kubeapt.io/product: "Kubernetes"
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
    - apiGroups:
      - ''
      apiVersions:
      - v1
      operations:
      - CREATE
      - UPDATE
      resources:
      - pods
  validations:
  - expression: |
      !has(object.spec.hostNetwork) || object.spec.hostNetwork == false
    message: |
      Using hostNetwork is disallowed. spec.hostNetwork must be undefined or set to false.
