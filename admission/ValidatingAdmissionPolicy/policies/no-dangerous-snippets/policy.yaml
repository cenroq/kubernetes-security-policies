apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: ingress-configuration-snippets
  annotations:
    cenroq.io/finding: "oq-0351"
    cenroq.io/kubernetes-version-min: "1.27"
    security.kubeapt.io/displayName: "Uses a Raw Controller Snippet Annotation"
    security.kubeapt.io/description: "Snippet annotations are folded straight into the shared ingress controller configuration, so anyone able to create an Ingress can hijack hosts from other namespaces, strip authentication, or run code inside the controller."
    security.kubeapt.io/resource: "Ingresses"
    security.kubeapt.io/severity: "Moderate"
    security.kubeapt.io/remediation: "Delete the ingress-nginx and HAProxy snippet annotations and make the routing or authentication change through supported Ingress fields or controller configuration owned by the platform team. Field: metadata.annotations."
    security.kubeapt.io/product: "Kubernetes"
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
    - apiGroups:
      - networking.k8s.io
      apiVersions:
      - v1
      operations:
      - CREATE
      - UPDATE
      resources:
      - ingresses
  validations:
  - expression: |
      !has(object.metadata.annotations) || (
        !object.metadata.annotations.exists(k, k in [
          "nginx.ingress.kubernetes.io/configuration-snippet",
          "nginx.ingress.kubernetes.io/server-snippet",
          "nginx.ingress.kubernetes.io/auth-snippet",
          "haproxy.org/backend-config-snippet"
        ])
      )
    message: |
      Dangerous Ingress annotations (ingress-nginx configuration/server/auth snippets, HAProxy backend config snippet) are disallowed except in tightly-controlled namespaces.
