apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: clusterrole-nonresource-urls
  annotations:
    cenroq.io/finding: "oq-0281"
    cenroq.io/kubernetes-version-min: "1.27"
    security.kubeapt.io/displayName: "Grants Broad Non-Resource URL Access"
    security.kubeapt.io/description: "Wildcard or root non-resource paths grant every API server endpoint outside the resource model, so /logs serves node file contents and /debug/pprof heap dumps that carry in-flight credentials straight to the role holder."
    security.kubeapt.io/resource: "ClusterRoles"
    security.kubeapt.io/severity: "Moderate"
    security.kubeapt.io/remediation: "Replace the wildcard or root paths with the specific endpoints the caller needs, such as /healthz or /version, and limit the verbs to get. Fields: rules[*].nonResourceURLs, rules[*].verbs."
    security.kubeapt.io/product: "Kubernetes"
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
    - apiGroups:
      - rbac.authorization.k8s.io
      apiVersions:
      - v1
      operations:
      - CREATE
      - UPDATE
      resources:
      - clusterroles
  validations:
  - expression: |
      !has(object.rules) || object.rules.all(r,
        !(has(r.nonResourceURLs) && has(r.verbs) &&
          r.nonResourceURLs.exists(u, u == "*" || u in ["/","/api","/api/*","/metrics","/logs","/debug","/debug/*"]) &&
          r.verbs.exists(v, v in ["get","post","create","update","patch","delete"]))
      )
    message: |
      ClusterRoles must not grant broad nonResourceURL access to API server endpoints (/, /api, /api/*, /metrics, /logs, /debug/*).
