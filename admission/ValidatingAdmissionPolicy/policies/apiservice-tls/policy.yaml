apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: apiservice-tls
  annotations:
    security.kubeapt.io/displayName: "APIService TLS"
    security.kubeapt.io/description: "Skipping certificate verification lets the kube-apiserver proxy aggregated API calls to whatever answers the service endpoint, so anything able to spoof or intercept that connection reads forwarded user identity and returns forged API responses."
    security.kubeapt.io/resource: "APIServices"
    security.kubeapt.io/severity: "High"
    security.kubeapt.io/remediation: "Set spec.insecureSkipTLSVerify to false and instead pin the CA that signed the extension API server certificate in spec.caBundle. Field: spec.insecureSkipTLSVerify."
    security.kubeapt.io/product: "Kubernetes"
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
    - apiGroups:
      - apiregistration.k8s.io
      apiVersions:
      - v1
      operations:
      - CREATE
      - UPDATE
      resources:
      - apiservices
  validations:
  - expression: |
      !has(object.spec.service) ||
      object.spec.?insecureSkipTLSVerify.orValue(false) != true
    message: |
      Aggregated (service-backed) APIServices must not set insecureSkipTLSVerify to true.
