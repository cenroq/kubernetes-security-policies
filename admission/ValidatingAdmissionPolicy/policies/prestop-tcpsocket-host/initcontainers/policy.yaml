apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: prestop-tcpsocket-host-initcontainers
  annotations:
    security.kubeapt.io/displayName: "Prestop Tcpsocket Host"
    security.kubeapt.io/description: "Naming another host in a preStop TCP hook points init container shutdown at an off-pod address through a handler the kubelet does not support, so the hook fails and cleanup never runs."
    security.kubeapt.io/resource: "Initcontainers"
    security.kubeapt.io/severity: "Low"
    security.kubeapt.io/remediation: "Remove the host field or set it to an empty string, and prefer an exec or httpGet handler since tcpSocket hooks are unsupported. Field: spec.initContainers[*].lifecycle.preStop.tcpSocket.host."
    security.kubeapt.io/product: "Kubernetes"
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
    - apiGroups:
      - ''
      apiVersions:
      - v1
      operations:
      - CREATE
      - UPDATE
      resources:
      - pods
  validations:
  - expression: |
      !has(object.spec.initContainers) || object.spec.initContainers.all(ic,
        !has(ic.lifecycle) ||
        !has(ic.lifecycle.preStop) ||
        !has(ic.lifecycle.preStop.tcpSocket) ||
        !has(ic.lifecycle.preStop.tcpSocket.host) ||
        ic.lifecycle.preStop.tcpSocket.host == ""
      )
    message: |
      spec.initContainers[*].lifecycle.preStop.tcpSocket.host must be undefined or empty ("").
