apiVersion: v1
kind: Pod
metadata:
  name: capabilities-drop-all-containers
  annotations:
    cenroq.io/finding: "oq-0301"
spec:
  containers:
  - name: main
    image: busybox:1.36
    command:
    - sh
    - -c
    - sleep 3600
    securityContext:
      capabilities:
        drop:
        - NET_RAW
