apiVersion: v1
kind: Pod
metadata:
  name: prestop-httpget-host-containers
  annotations:
    kubeapt.io/uuid: "a4a204b3-86fa-42d3-bf58-ed97453603a9"
spec:
  containers:
  - name: main
    image: busybox:1.36
    command:
    - sh
    - -c
    - sleep 3600
    lifecycle:
      preStop:
        httpGet:
          path: /
          port: 80
          host: 127.0.0.1
