apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: prestop-httpget-host-initcontainers
  annotations:
    security.kubeapt.io/displayName: "Prestop Httpget Host"
    security.kubeapt.io/description: "A preStop HTTP hook aimed at another host makes the kubelet call an arbitrary URL from the node whenever an init container shuts down, reaching internal endpoints closed to pods and triggering side effects there."
    security.kubeapt.io/resource: "Initcontainers"
    security.kubeapt.io/severity: "Low"
    security.kubeapt.io/remediation: "Remove the host field so the hook targets the pod IP, or set it to an empty string. Field: spec.initContainers[*].lifecycle.preStop.httpGet.host."
    security.kubeapt.io/product: "Kubernetes"
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
    - apiGroups:
      - ''
      apiVersions:
      - v1
      operations:
      - CREATE
      - UPDATE
      resources:
      - pods
  validations:
  - expression: |
      !has(object.spec.initContainers) || object.spec.initContainers.all(ic,
        !has(ic.lifecycle) ||
        !has(ic.lifecycle.preStop) ||
        !has(ic.lifecycle.preStop.httpGet) ||
        !has(ic.lifecycle.preStop.httpGet.host) ||
        ic.lifecycle.preStop.httpGet.host == ""
      )
    message: |
      spec.initContainers[*].lifecycle.preStop.httpGet.host must be undefined or empty ("").
