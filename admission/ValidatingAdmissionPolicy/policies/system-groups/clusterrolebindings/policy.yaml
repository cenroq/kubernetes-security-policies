apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: clusterrolebinding-system-groups
  annotations:
    kubeapt.io/uuid: "48b8600b-24d9-49f1-b74c-e2f6d9f55659"
    security.kubeapt.io/displayName: "Binds a Privileged Role to a System Group"
    security.kubeapt.io/description: "Binding a ClusterRole to a system group grants it cluster-wide to a whole population at once, and groups like system:authenticated or system:serviceaccounts cover every account in the cluster including ones an attacker controls."
    security.kubeapt.io/resource: "ClusterRoleBindings"
    security.kubeapt.io/severity: "Moderate"
    security.kubeapt.io/remediation: "Replace the system group subject with the specific users, groups or ServiceAccounts that need the role. Fields: subjects[*].kind, subjects[*].name."
    security.kubeapt.io/product: "Kubernetes"
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
    - apiGroups:
      - rbac.authorization.k8s.io
      apiVersions:
      - v1
      operations:
      - CREATE
      - UPDATE
      resources:
      - clusterrolebindings
  validations:
  - expression: |
      !has(object.subjects) || object.subjects.all(s,
        !(s.kind == "Group" && s.name.matches("system:.*"))
      )
    message: |
      ClusterRoleBindings must not bind powerful roles to broad system groups (authenticated/unauthenticated/serviceaccounts).
