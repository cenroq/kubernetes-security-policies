apiVersion: v1
kind: Pod
metadata:
  name: capabilities-add-netbindservice-containers
  annotations:
    cenroq.io/finding: "oq-0300"
spec:
  containers:
  - name: main
    image: busybox:1.36
    command:
    - sh
    - -c
    - sleep 3600
    securityContext:
      capabilities:
        add:
        - SYS_CHROOT
