apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: initcontainer-capabilities-add-netbindservice
  annotations:
    kubeapt.io/uuid: "f2e7ed11-9fd4-4f3a-aac3-176e884fd176"
    security.kubeapt.io/displayName: "Adds a Capability Other Than NET_BIND_SERVICE"
    security.kubeapt.io/description: "Added capabilities other than NET_BIND_SERVICE give an init container kernel privileges such as raw socket access, process tracing and filesystem mounting, extending its reach past its namespace onto the node."
    security.kubeapt.io/resource: "InitContainers"
    security.kubeapt.io/severity: "Moderate"
    security.kubeapt.io/remediation: "Remove every entry from the added capability list except NET_BIND_SERVICE, or drop the list entirely. Field: spec.initContainers[*].securityContext.capabilities.add."
    security.kubeapt.io/product: "Kubernetes"
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
    - apiGroups:
      - ''
      apiVersions:
      - v1
      operations:
      - CREATE
      - UPDATE
      resources:
      - pods
  variables:
  - name: allowedCaps
    expression: |
      ["NET_BIND_SERVICE"]
  validations:
  - expression: |
      (has(object.spec.os) &&
       has(object.spec.os.name) &&
       object.spec.os.name.lowerAscii() == "windows") ||
      !has(object.spec.initContainers) || object.spec.initContainers.all(ic,
        !has(ic.securityContext) ||
        !has(ic.securityContext.capabilities) ||
        !has(ic.securityContext.capabilities.add) ||
        ic.securityContext.capabilities.add.all(cap,
          variables.allowedCaps.exists(a, a == cap)
        )
      )
    message: |
      spec.initContainers[*].securityContext.capabilities.add must be undefined/nil or contain only "NET_BIND_SERVICE".
