apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: storageclass-cmek-oci-block
  annotations:
    kubeapt.io/uuid: "9f793a96-20bc-4d2e-9210-c41dfa1ec932"
    security.kubeapt.io/displayName: "Provisions OCI Volumes Without a Customer-Managed Key"
    security.kubeapt.io/description: "Without a Vault master key, volumes provisioned from this class fall back to Oracle-managed keys that you cannot rotate, audit or revoke, so backups and volume clones stay readable to anyone with tenancy-level access."
    security.kubeapt.io/resource: "StorageClasses"
    security.kubeapt.io/severity: "Low"
    security.kubeapt.io/remediation: "Set the kms-key-id parameter to an OCI Vault master key OCID on blockvolume.csi.oraclecloud.com StorageClasses. Field: parameters['kms-key-id']."
    security.kubeapt.io/product: "Kubernetes"
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
    - apiGroups:
      - storage.k8s.io
      apiVersions:
      - v1
      operations:
      - CREATE
      - UPDATE
      resources:
      - storageclasses
  validations:
  - expression: |
      object.provisioner != 'blockvolume.csi.oraclecloud.com' ||
      (has(object.parameters) && 'kms-key-id' in object.parameters &&
       object.parameters['kms-key-id'] != '')
    message: |
      Oracle OCI Block Volume StorageClasses must use a customer-managed encryption key (parameters."kms-key-id").
