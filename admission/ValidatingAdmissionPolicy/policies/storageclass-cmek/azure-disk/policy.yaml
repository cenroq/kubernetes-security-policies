apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: storageclass-cmek-azure-disk
  annotations:
    security.kubeapt.io/displayName: "StorageClass CMEK (Azure Disk)"
    security.kubeapt.io/description: "Without a Disk Encryption Set, disks provisioned from this class fall back to platform-managed keys that you cannot rotate, audit or revoke, so snapshots and disk copies stay readable to anyone with subscription-level access."
    security.kubeapt.io/resource: "StorageClasses"
    security.kubeapt.io/severity: "Low"
    security.kubeapt.io/remediation: "Set parameters.diskEncryptionSetID to the resource ID of a Disk Encryption Set backed by your own key vault key on disk.csi.azure.com StorageClasses. Field: parameters.diskEncryptionSetID."
    security.kubeapt.io/product: "Kubernetes"
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
    - apiGroups:
      - storage.k8s.io
      apiVersions:
      - v1
      operations:
      - CREATE
      - UPDATE
      resources:
      - storageclasses
  validations:
  - expression: |
      object.provisioner != 'disk.csi.azure.com' ||
      (has(object.parameters) && 'diskEncryptionSetID' in object.parameters &&
       object.parameters['diskEncryptionSetID'] != '')
    message: |
      Azure Disk StorageClasses must use a customer-managed Disk Encryption Set (parameters.diskEncryptionSetID).
