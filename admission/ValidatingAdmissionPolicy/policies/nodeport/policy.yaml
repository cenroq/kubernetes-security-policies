apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: service-nodeport
  annotations:
    security.kubeapt.io/displayName: "Nodeport"
    security.kubeapt.io/description: "A NodePort opens the same port on every node address, bypassing the ingress path with its TLS termination and authentication and leaving node-level firewalling as the only control between the workload and the wider network."
    security.kubeapt.io/resource: "Services"
    security.kubeapt.io/severity: "High"
    security.kubeapt.io/remediation: "Set spec.type to ClusterIP and expose the workload through an Ingress, or use a LoadBalancer Service that the platform fronts with its own controls. Field: spec.type."
    security.kubeapt.io/product: "Kubernetes"
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
    - apiGroups:
      - ''
      apiVersions:
      - v1
      operations:
      - CREATE
      - UPDATE
      resources:
      - services
  validations:
  - expression: |
      !has(object.spec.type) || object.spec.type != "NodePort"
    message: |
      Service type NodePort is disallowed; use ClusterIP/LoadBalancer with proper controls.
