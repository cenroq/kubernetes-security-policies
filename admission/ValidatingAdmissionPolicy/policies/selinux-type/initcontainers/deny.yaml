apiVersion: v1
kind: Pod
metadata:
  name: selinux-type-initcontainers
  annotations:
    cenroq.io/finding: "oq-0378"
spec:
  containers:
  - name: main
    image: busybox:1.36
    command:
    - sh
    - -c
    - sleep 3600
  initContainers:
  - name: init
    image: busybox:1.36
    command:
    - sh
    - -c
    - echo init
    securityContext:
      seLinuxOptions:
        type: type_t
