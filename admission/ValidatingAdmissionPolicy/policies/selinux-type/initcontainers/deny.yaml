apiVersion: v1
kind: Pod
metadata:
  name: selinux-type-initcontainers
  annotations:
    kubeapt.io/uuid: "f73f5ff5-358d-4f0f-a299-de4e05d26ba1"
spec:
  containers:
  - name: main
    image: busybox:1.36
    command:
    - sh
    - -c
    - sleep 3600
  initContainers:
  - name: init
    image: busybox:1.36
    command:
    - sh
    - -c
    - echo init
    securityContext:
      seLinuxOptions:
        type: type_t
