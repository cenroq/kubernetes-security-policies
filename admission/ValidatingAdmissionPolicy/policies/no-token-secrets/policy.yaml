apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: serviceaccount-no-token-secrets
  annotations:
    security.kubeapt.io/displayName: "No Token Secrets"
    security.kubeapt.io/description: "A long-lived token Secret bound to a ServiceAccount never expires and is tied to no pod lifetime, so a single leaked value grants that identity permanent API access until someone notices and rotates it."
    security.kubeapt.io/resource: "ServiceAccounts"
    security.kubeapt.io/severity: "High"
    security.kubeapt.io/remediation: "Empty the ServiceAccount secrets list and delete the associated token Secrets, letting workloads use short-lived projected tokens instead. Field: secrets."
    security.kubeapt.io/product: "Kubernetes"
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
    - apiGroups:
      - ''
      apiVersions:
      - v1
      operations:
      - CREATE
      - UPDATE
      resources:
      - serviceaccounts
  validations:
  - expression: |
      !has(object.secrets) || size(object.secrets) == 0
    message: |
      Avoid explicit long-lived token Secrets on ServiceAccounts.
