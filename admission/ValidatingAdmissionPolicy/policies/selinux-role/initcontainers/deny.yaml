apiVersion: v1
kind: Pod
metadata:
  name: selinux-role-initcontainers
  annotations:
    kubeapt.io/uuid: "32ff7e30-616c-43a7-92ae-44022ecc0da3"
spec:
  containers:
  - name: main
    image: busybox:1.36
    command:
    - sh
    - -c
    - sleep 3600
  initContainers:
  - name: init
    image: busybox:1.36
    command:
    - sh
    - -c
    - echo init
    securityContext:
      seLinuxOptions:
        role: role_r
