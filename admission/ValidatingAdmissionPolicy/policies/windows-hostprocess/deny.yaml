apiVersion: v1
kind: Pod
metadata:
  name: windows-hostprocess-pod
  annotations:
    cenroq.io/finding: "oq-0413"
spec:
  hostNetwork: true
  containers:
  - name: main
    image: busybox:1.36
    command:
    - sh
    - -c
    - sleep 3600
  securityContext:
    windowsOptions:
      hostProcess: true
  os:
    name: windows
