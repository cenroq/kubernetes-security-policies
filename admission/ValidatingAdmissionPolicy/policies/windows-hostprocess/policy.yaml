apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: windows-hostprocess
  annotations:
    security.kubeapt.io/displayName: "Windows Hostprocess"
    security.kubeapt.io/description: "A Windows HostProcess pod runs its containers directly on the node in the host namespaces under a system account, exposing the host filesystem, registry and services and making node compromise trivial."
    security.kubeapt.io/resource: "Pods"
    security.kubeapt.io/severity: "Critical"
    security.kubeapt.io/remediation: "Remove windowsOptions.hostProcess from the pod security context or set it to false. Field: spec.securityContext.windowsOptions.hostProcess."
    security.kubeapt.io/product: "Kubernetes"
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
    - apiGroups:
      - ''
      apiVersions:
      - v1
      operations:
      - CREATE
      - UPDATE
      resources:
      - pods
  validations:
  - expression: |
      !has(object.spec.securityContext) || !has(object.spec.securityContext.windowsOptions) || !has(object.spec.securityContext.windowsOptions.hostProcess) || object.spec.securityContext.windowsOptions.hostProcess == false
    message: |
      HostProcess is not allowed. spec.securityContext.windowsOptions.hostProcess must be undefined or set to false.
