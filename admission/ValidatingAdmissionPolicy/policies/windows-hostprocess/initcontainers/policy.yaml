apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: windows-hostprocess-initcontainers
  annotations:
    security.kubeapt.io/displayName: "Windows Hostprocess"
    security.kubeapt.io/description: "A Windows HostProcess init container runs directly on the node in the host namespaces under a system account, exposing the host filesystem, registry and services and making node compromise trivial."
    security.kubeapt.io/resource: "Initcontainers"
    security.kubeapt.io/severity: "Critical"
    security.kubeapt.io/remediation: "Remove windowsOptions.hostProcess from every init container security context or set it to false. Field: spec.initContainers[*].securityContext.windowsOptions.hostProcess."
    security.kubeapt.io/product: "Kubernetes"
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
    - apiGroups:
      - ''
      apiVersions:
      - v1
      operations:
      - CREATE
      - UPDATE
      resources:
      - pods
  validations:
  - expression: |
      !has(object.spec.initContainers) || object.spec.initContainers.all(c,
        !has(c.securityContext) ||
        !has(c.securityContext.windowsOptions) ||
        !has(c.securityContext.windowsOptions.hostProcess) ||
        c.securityContext.windowsOptions.hostProcess == false
      )
    message: |
      HostProcess is not allowed for initContainers. Each spec.initContainers[*].securityContext.windowsOptions.hostProcess must be undefined or set to false.
