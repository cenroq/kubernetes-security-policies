apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: service-no-admin-ports
  annotations:
    security.kubeapt.io/displayName: "No Admin Ports"
    security.kubeapt.io/description: "Admin, debug, metrics and management listeners are usually unauthenticated, so publishing them on a LoadBalancer or NodePort hands outside callers internal telemetry, profiling and heap dumps, and sometimes live control over the workload."
    security.kubeapt.io/resource: "Services"
    security.kubeapt.io/severity: "Low"
    security.kubeapt.io/remediation: "Move the admin, debug, metrics and management ports to a separate ClusterIP Service and leave only application ports on the externally reachable one. Fields: spec.type, spec.ports[*].name."
    security.kubeapt.io/product: "Kubernetes"
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
    - apiGroups:
      - ''
      apiVersions:
      - v1
      operations:
      - CREATE
      - UPDATE
      resources:
      - services
  validations:
  - expression: |
      !(
        (object.spec.type == 'LoadBalancer' || object.spec.type == 'NodePort')
        &&
        object.spec.ports.exists(p,
          has(p.name) &&
          p.name.matches('(?i).*(admin|debug|metrics|mgmt|management).*')
        )
      )
    message: Externally reachable Services (type LoadBalancer/NodePort) must not expose admin/debug/metrics ports. Split these endpoints into a separate internal-only Service.
