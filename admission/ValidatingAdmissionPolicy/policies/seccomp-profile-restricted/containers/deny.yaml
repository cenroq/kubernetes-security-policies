apiVersion: v1
kind: Pod
metadata:
  name: seccomp-profile-restricted-containers
  annotations:
    cenroq.io/finding: "oq-0321"
spec:
  containers:
  - name: main
    image: busybox:1.36
    command:
    - sh
    - -c
    - sleep 3600
    securityContext:
      seccompProfile:
        type: Unconfined
