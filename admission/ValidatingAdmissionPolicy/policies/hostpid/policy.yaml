apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: hostpid
  annotations:
    security.kubeapt.io/displayName: "Hostpid"
    security.kubeapt.io/description: "Sharing the host PID namespace exposes every process on the node to the container, leaking credentials from process command lines and /proc and letting it signal or trace host and other tenant workloads."
    security.kubeapt.io/resource: "Pods"
    security.kubeapt.io/severity: "Critical"
    security.kubeapt.io/remediation: "Remove spec.hostPID or set it to false. Field: spec.hostPID."
    security.kubeapt.io/product: "Kubernetes"
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
    - apiGroups:
      - ''
      apiVersions:
      - v1
      operations:
      - CREATE
      - UPDATE
      resources:
      - pods
  validations:
  - expression: |
      !has(object.spec.hostPID) || object.spec.hostPID == false
    message: |
      Using hostPID is disallowed. spec.hostPID must be undefined or set to false.
