apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: ingress-tls-required
  annotations:
    security.kubeapt.io/displayName: "Tls Required"
    security.kubeapt.io/description: "An Ingress with no TLS entry covering its hosts is published over plain HTTP, so credentials, session cookies and API tokens travel unencrypted and any device on the path can read or modify the traffic."
    security.kubeapt.io/resource: "Ingresses"
    security.kubeapt.io/severity: "High"
    security.kubeapt.io/remediation: "Add a spec.tls entry whose hosts list contains every hostname used by the rules, backed by a certificate Secret for those names. Fields: spec.rules[*].host, spec.tls[*].hosts."
    security.kubeapt.io/product: "Kubernetes"
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
    - apiGroups:
      - networking.k8s.io
      apiVersions:
      - v1
      operations:
      - CREATE
      - UPDATE
      resources:
      - ingresses
  variables:
  - name: hosts
    expression: |
      has(object.spec.rules) ? object.spec.rules.filter(r, has(r.host)).map(r, r.host) : []
  validations:
  - expression: |
      size(variables.hosts) == 0 || (has(object.spec.tls) &&
       object.spec.tls.exists(t,
         has(t.hosts) && variables.hosts.all(h, t.hosts.exists(th, th == h))
       ))
    message: |
      Ingress must include a TLS entry covering every host in spec.rules[*].host.
