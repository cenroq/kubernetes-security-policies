apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: configmap-no-executable-code
  annotations:
    security.kubeapt.io/displayName: "No Executable Code"
    security.kubeapt.io/description: "Scripts stored in a ConfigMap and executed by a pod turn ConfigMap write access into code execution inside the container, bypassing image scanning, image signing and any review of what actually runs."
    security.kubeapt.io/resource: "ConfigMaps"
    security.kubeapt.io/severity: "Low"
    security.kubeapt.io/remediation: "Move scripts, shebang files and other executable content into the container image or a signed artifact, keeping only inert configuration values in the ConfigMap. Field: data."
    security.kubeapt.io/product: "Kubernetes"
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
    - apiGroups:
      - ''
      apiVersions:
      - v1
      operations:
      - CREATE
      - UPDATE
      resources:
      - configmaps
  validations:
  - expression: |
      !has(object.data) || !object.data.exists(
        k,
        v,
        k.lowerAscii().matches(".*\\.(sh|bash|py|lua|js|ts|rb|pl|php|groovy|tmpl)$") ||
        v.matches("(?s).*#!/\\S+") ||
        v.matches("(?i).*\\b(function|import|require|process|exec)\\b.*")
      )
    message: |
      Do not store executable code or scripts in ConfigMaps that applications run.
