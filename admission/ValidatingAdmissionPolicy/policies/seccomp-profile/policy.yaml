apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: seccomp-profile-pod
  annotations:
    security.kubeapt.io/displayName: "Seccomp Profile"
    security.kubeapt.io/description: "An Unconfined seccomp profile at pod level removes the syscall filter from every container inheriting it, exposing the full kernel syscall surface including the obscure calls that container escape and privilege-escalation exploits depend on."
    security.kubeapt.io/resource: "Pods"
    security.kubeapt.io/severity: "Moderate"
    security.kubeapt.io/remediation: "Replace Unconfined with RuntimeDefault, or with Localhost naming a profile loaded on the node. Field: spec.securityContext.seccompProfile.type."
    security.kubeapt.io/product: "Kubernetes"
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
    - apiGroups:
      - ''
      apiVersions:
      - v1
      operations:
      - CREATE
      - UPDATE
      resources:
      - pods
  variables:
  - name: allowedSeccompTypes
    expression: |
      ["RuntimeDefault","Localhost"]
  validations:
  - expression: |
      (has(object.spec.os) &&
       has(object.spec.os.name) &&
       object.spec.os.name.lowerAscii() == "windows") ||
      !has(object.spec.securityContext) || !has(object.spec.securityContext.seccompProfile) || !has(object.spec.securityContext.seccompProfile.type) || variables.allowedSeccompTypes.exists(t, t == object.spec.securityContext.seccompProfile.type)
    message: |
      spec.securityContext.seccompProfile.type must be undefined, RuntimeDefault, or Localhost.
