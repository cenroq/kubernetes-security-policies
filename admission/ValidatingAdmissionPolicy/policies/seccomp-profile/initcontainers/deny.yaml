apiVersion: v1
kind: Pod
metadata:
  name: seccomp-profile-initcontainers
  annotations:
    kubeapt.io/uuid: "1d1a7bed-e513-42e9-9089-0e9ac08c562c"
spec:
  containers:
  - name: main
    image: busybox:1.36
    command:
    - sh
    - -c
    - sleep 3600
  initContainers:
  - name: init
    image: busybox:1.36
    command:
    - sh
    - -c
    - echo init
    securityContext:
      seccompProfile:
        type: Unconfined
