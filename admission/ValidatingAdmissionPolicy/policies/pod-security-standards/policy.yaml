apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: namespace-pod-security-standards
  annotations:
    kubeapt.io/uuid: "00728e67-856f-45a1-9b84-7e34c2c8cf9e"
    security.kubeapt.io/displayName: "Sets No Pod Security Standards Label"
    security.kubeapt.io/description: "A namespace that is not held to at least the baseline Pod Security Standard lets anyone able to create pods there run privileged, host-networked or hostPath workloads and break out to the node unchallenged."
    security.kubeapt.io/resource: "Namespaces"
    security.kubeapt.io/severity: "Moderate"
    security.kubeapt.io/remediation: "Label the namespace with pod-security.kubernetes.io/enforce set to baseline or restricted; an audit or warn label at those levels also satisfies the check but does not block workloads. Fields: metadata.labels[\"pod-security.kubernetes.io/enforce\"], metadata.labels[\"pod-security.kubernetes.io/audit\"], metadata.labels[\"pod-security.kubernetes.io/warn\"]."
    security.kubeapt.io/product: "Kubernetes"
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
    - apiGroups:
      - ''
      apiVersions:
      - v1
      operations:
      - CREATE
      - UPDATE
      resources:
      - namespaces
  validations:
  - expression: |
      (has(object.metadata.labels) && "pod-security.kubernetes.io/enforce" in object.metadata.labels && object.metadata.labels["pod-security.kubernetes.io/enforce"] in ["baseline", "restricted"]) ||
      (has(object.metadata.labels) && "pod-security.kubernetes.io/audit" in object.metadata.labels && object.metadata.labels["pod-security.kubernetes.io/audit"] in ["baseline", "restricted"]) ||
      (has(object.metadata.labels) && "pod-security.kubernetes.io/warn" in object.metadata.labels && object.metadata.labels["pod-security.kubernetes.io/warn"] in ["baseline", "restricted"])
    message: |
      Namespace must set one of pod-security.kubernetes.io/{enforce,audit,warn} to baseline or restricted.
