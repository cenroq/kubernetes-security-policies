apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: procmount-initcontainers
  annotations:
    security.kubeapt.io/displayName: "Procmount"
    security.kubeapt.io/description: "An unmasked /proc strips the default masks and read-only paths the runtime applies, exposing kernel memory and tunables such as /proc/kcore and /proc/sys to the init container and easing container escape."
    security.kubeapt.io/resource: "Initcontainers"
    security.kubeapt.io/severity: "Critical"
    security.kubeapt.io/remediation: "Remove securityContext.procMount from every init container or set it back to Default instead of Unmasked. Field: spec.initContainers[*].securityContext.procMount."
    security.kubeapt.io/product: "Kubernetes"
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
    - apiGroups:
      - ''
      apiVersions:
      - v1
      operations:
      - CREATE
      - UPDATE
      resources:
      - pods
  validations:
  - expression: |
      !has(object.spec.initContainers) || object.spec.initContainers.all(ic,
        !has(ic.securityContext) ||
        !has(ic.securityContext.procMount) ||
        ic.securityContext.procMount == "Default"
      )
    message: |
      spec.initContainers[*].securityContext.procMount must be undefined or "Default".
