apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: ephemeralcontainer-procmount
  annotations:
    cenroq.io/finding: "oq-0339"
    cenroq.io/kubernetes-version-min: "1.33"
    security.kubeapt.io/displayName: "Uses an Unmasked /proc Mount"
    security.kubeapt.io/description: "An unmasked /proc strips the default masks and read-only paths the runtime applies, exposing kernel memory and tunables such as /proc/kcore and /proc/sys to the ephemeral container and easing container escape."
    security.kubeapt.io/resource: "EphemeralContainers"
    security.kubeapt.io/severity: "High"
    security.kubeapt.io/remediation: "Remove securityContext.procMount from every ephemeral container or set it back to Default instead of Unmasked. Field: spec.ephemeralContainers[*].securityContext.procMount."
    security.kubeapt.io/product: "Kubernetes"
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
    - apiGroups:
      - ''
      apiVersions:
      - v1
      operations:
      - CREATE
      - UPDATE
      resources:
      - pods/ephemeralcontainers
  validations:
  - expression: |
      !has(object.spec.ephemeralContainers) || object.spec.ephemeralContainers.all(ec,
        !has(ec.securityContext) ||
        !has(ec.securityContext.procMount) ||
        ec.securityContext.procMount == "Default"
      )
    message: |
      spec.ephemeralContainers[*].securityContext.procMount must be undefined or "Default".
