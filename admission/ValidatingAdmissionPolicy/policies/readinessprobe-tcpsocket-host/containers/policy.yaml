apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: container-readinessprobe-tcpsocket-host
  annotations:
    kubeapt.io/uuid: "15864541-e1ff-4369-b8c5-785ced7de8ce"
    security.kubeapt.io/displayName: "Readiness TCP Probe Targets an Arbitrary Host"
    security.kubeapt.io/description: "Pointing the readiness TCP probe at another host makes the kubelet open connections from the node to an arbitrary address, probing endpoints closed to pods, while Service traffic keeps reaching an unchecked container."
    security.kubeapt.io/resource: "Containers"
    security.kubeapt.io/severity: "Low"
    security.kubeapt.io/remediation: "Remove the host field so the probe targets the pod IP, or set it to an empty string. Field: spec.containers[*].readinessProbe.tcpSocket.host."
    security.kubeapt.io/product: "Kubernetes"
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
    - apiGroups:
      - ''
      apiVersions:
      - v1
      operations:
      - CREATE
      - UPDATE
      resources:
      - pods
  validations:
  - expression: |
      object.spec.containers.all(c,
        !has(c.readinessProbe) ||
        !has(c.readinessProbe.tcpSocket) ||
        !has(c.readinessProbe.tcpSocket.host) ||
        c.readinessProbe.tcpSocket.host == ""
      )
    message: |
      spec.containers[*].readinessProbe.tcpSocket.host must be undefined or empty ("").
