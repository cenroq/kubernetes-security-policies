apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: storageclass-encryption-linode
  annotations:
    security.kubeapt.io/displayName: "StorageClass Encryption (Linode)"
    security.kubeapt.io/description: "Volumes provisioned from this class are stored without LUKS encryption, so data sits in plaintext on the Linode block storage backend and is readable from a detached volume, a clone or the underlying host."
    security.kubeapt.io/resource: "StorageClasses"
    security.kubeapt.io/severity: "Low"
    security.kubeapt.io/remediation: "Set the linodebs.csi.linode.com/luks-encrypted parameter to true on linodebs.csi.linode.com StorageClasses and add the required node-stage secret parameters. Field: parameters['linodebs.csi.linode.com/luks-encrypted']."
    security.kubeapt.io/product: "Kubernetes"
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
    - apiGroups:
      - storage.k8s.io
      apiVersions:
      - v1
      operations:
      - CREATE
      - UPDATE
      resources:
      - storageclasses
  validations:
  - expression: |
      object.provisioner != 'linodebs.csi.linode.com' ||
      (has(object.parameters) && 'linodebs.csi.linode.com/luks-encrypted' in object.parameters &&
       object.parameters['linodebs.csi.linode.com/luks-encrypted'] == 'true')
    message: |
      Linode Block Storage StorageClasses must enable LUKS encryption (parameters."linodebs.csi.linode.com/luks-encrypted": "true").
