apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: storageclass-encryption-ibm-vpc-block
  annotations:
    kubeapt.io/uuid: "70aa28c5-3cfe-45d0-a52d-66d2ad804696"
    security.kubeapt.io/displayName: "Provisions Unencrypted IBM VPC Block Volumes"
    security.kubeapt.io/description: "Volumes provisioned from this class rely on provider-held keys that you cannot rotate or revoke, so the data on the underlying block storage and its snapshots stays readable outside your control."
    security.kubeapt.io/resource: "StorageClasses"
    security.kubeapt.io/severity: "Low"
    security.kubeapt.io/remediation: "Set parameters.encrypted to true on vpc.block.csi.ibm.io StorageClasses and set parameters.encryptionKey to the CRN of your Key Protect or Hyper Protect root key. Field: parameters.encrypted."
    security.kubeapt.io/product: "Kubernetes"
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
    - apiGroups:
      - storage.k8s.io
      apiVersions:
      - v1
      operations:
      - CREATE
      - UPDATE
      resources:
      - storageclasses
  validations:
  - expression: |
      object.provisioner != 'vpc.block.csi.ibm.io' ||
      (has(object.parameters) && 'encrypted' in object.parameters &&
       object.parameters['encrypted'] == 'true')
    message: |
      IBM VPC Block StorageClasses must enable customer-managed encryption (parameters.encrypted: "true").
