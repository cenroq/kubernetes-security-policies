apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: storageclass-encryption-longhorn
  annotations:
    kubeapt.io/uuid: "e9a587e3-d5f8-48b3-b42c-22f35db3227e"
    security.kubeapt.io/displayName: "Provisions Unencrypted Longhorn Volumes"
    security.kubeapt.io/description: "Volumes provisioned from this class keep their replicas in plaintext on node disks, so anyone who can read a replica directory, a backup target or a removed disk recovers the data without any Kubernetes access."
    security.kubeapt.io/resource: "StorageClasses"
    security.kubeapt.io/severity: "Low"
    security.kubeapt.io/remediation: "Set parameters.encrypted to true on driver.longhorn.io StorageClasses and add the CSI node-publish and provisioner secret references that hold the passphrase. Field: parameters.encrypted."
    security.kubeapt.io/product: "Kubernetes"
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
    - apiGroups:
      - storage.k8s.io
      apiVersions:
      - v1
      operations:
      - CREATE
      - UPDATE
      resources:
      - storageclasses
  validations:
  - expression: |
      object.provisioner != 'driver.longhorn.io' ||
      (has(object.parameters) && 'encrypted' in object.parameters &&
       object.parameters['encrypted'] == 'true')
    message: |
      Longhorn StorageClasses must enable volume encryption (parameters.encrypted: "true").
