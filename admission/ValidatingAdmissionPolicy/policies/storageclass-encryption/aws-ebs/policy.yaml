apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: storageclass-encryption-aws-ebs
  annotations:
    kubeapt.io/uuid: "737e971e-9b80-4467-b548-42c688e4071e"
    security.kubeapt.io/displayName: "Provisions Unencrypted AWS EBS Volumes"
    security.kubeapt.io/description: "Volumes provisioned from this class land on unencrypted EBS disks, so anyone able to read the raw block storage or a snapshot copied to another account recovers the data without any Kubernetes access."
    security.kubeapt.io/resource: "StorageClasses"
    security.kubeapt.io/severity: "Low"
    security.kubeapt.io/remediation: "Set parameters.encrypted to true on ebs.csi.aws.com StorageClasses, optionally naming a KMS key in parameters.kmsKeyId. Field: parameters.encrypted."
    security.kubeapt.io/product: "Kubernetes"
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
    - apiGroups:
      - storage.k8s.io
      apiVersions:
      - v1
      operations:
      - CREATE
      - UPDATE
      resources:
      - storageclasses
  validations:
  - expression: |
      object.provisioner != 'ebs.csi.aws.com' ||
      (has(object.parameters) && 'encrypted' in object.parameters &&
       object.parameters['encrypted'] == 'true')
    message: |
      AWS EBS StorageClasses must enable at-rest encryption (parameters.encrypted: "true").
