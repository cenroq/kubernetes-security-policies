apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: initcontainer-startupprobe-httpget-host
  annotations:
    cenroq.io/finding: "oq-0380"
    cenroq.io/kubernetes-version-min: "1.29"
    security.kubeapt.io/displayName: "Startup Probe Targets an Arbitrary Host"
    security.kubeapt.io/description: "Redirecting the startup HTTP probe to another host makes the kubelet fetch an arbitrary URL from the node, reaching metadata and node-local endpoints closed to pods, and a hung init container passes its startup gate."
    security.kubeapt.io/resource: "InitContainers"
    security.kubeapt.io/severity: "Low"
    security.kubeapt.io/remediation: "Remove the host field so the probe targets the pod IP, or set it to an empty string. Field: spec.initContainers[*].startupProbe.httpGet.host."
    security.kubeapt.io/product: "Kubernetes"
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
    - apiGroups:
      - ''
      apiVersions:
      - v1
      operations:
      - CREATE
      - UPDATE
      resources:
      - pods
  validations:
  - expression: |
      !has(object.spec.initContainers) || object.spec.initContainers.all(ic,
        !has(ic.startupProbe) ||
        !has(ic.startupProbe.httpGet) ||
        !has(ic.startupProbe.httpGet.host) ||
        ic.startupProbe.httpGet.host == ""
      )
    message: |
      spec.initContainers[*].startupProbe.httpGet.host must be undefined or empty ("").
