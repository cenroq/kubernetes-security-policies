apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: initcontainer-run-as-user
  annotations:
    kubeapt.io/uuid: "bcd6af72-fa71-4104-b7e1-343413d24dce"
    security.kubeapt.io/displayName: "Runs as Root (UID 0)"
    security.kubeapt.io/description: "Running an init container as UID 0 gives every process the in-container root identity, so writable host mounts, setuid binaries and isolation weaknesses become exploitable with root file ownership and the full capability set."
    security.kubeapt.io/resource: "InitContainers"
    security.kubeapt.io/severity: "Moderate"
    security.kubeapt.io/remediation: "Set runAsUser to a non-zero UID such as 1000, or leave it unset so the image user applies. Field: spec.initContainers[*].securityContext.runAsUser."
    security.kubeapt.io/product: "Kubernetes"
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
    - apiGroups:
      - ''
      apiVersions:
      - v1
      operations:
      - CREATE
      - UPDATE
      resources:
      - pods
  validations:
  - expression: |
      !has(object.spec.initContainers) || object.spec.initContainers.all(ic,
        !has(ic.securityContext) ||
        !has(ic.securityContext.runAsUser) ||
        ic.securityContext.runAsUser > 0
      )
    message: |
      spec.initContainers[*].securityContext.runAsUser must be undefined or a non-zero value (> 0).
