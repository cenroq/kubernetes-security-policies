apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: run-as-user-ephemeralcontainers
  annotations:
    security.kubeapt.io/displayName: "Run As User"
    security.kubeapt.io/description: "Running an ephemeral debug container as UID 0 gives every process the in-container root identity, so writable host mounts, setuid binaries and isolation weaknesses become exploitable with root file ownership and the full capability set."
    security.kubeapt.io/resource: "Ephemeralcontainers"
    security.kubeapt.io/severity: "Moderate"
    security.kubeapt.io/remediation: "Set runAsUser to a non-zero UID such as 1000 on the debug container, or leave it unset so the image user applies. Field: spec.ephemeralContainers[*].securityContext.runAsUser."
    security.kubeapt.io/product: "Kubernetes"
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
    - apiGroups:
      - ''
      apiVersions:
      - v1
      operations:
      - CREATE
      - UPDATE
      resources:
      - pods/ephemeralcontainers
  validations:
  - expression: |
      !has(object.spec.ephemeralContainers) || object.spec.ephemeralContainers.all(ec,
        !has(ec.securityContext) ||
        !has(ec.securityContext.runAsUser) ||
        ec.securityContext.runAsUser > 0
      )
    message: |
      spec.ephemeralContainers[*].securityContext.runAsUser must be undefined or a non-zero value (> 0).
