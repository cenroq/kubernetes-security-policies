apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: calico-networkpolicy-egress-cidr
  annotations:
    security.kubeapt.io/displayName: "Calico NetworkPolicy Allow-All Egress"
    security.kubeapt.io/description: "An Allow to 0.0.0.0/0 or ::/0 gives the selected endpoints unrestricted outbound reach, the channel a compromised workload uses to contact command-and-control hosts, pull further tooling and exfiltrate data."
    security.kubeapt.io/resource: "NetworkPolicies"
    security.kubeapt.io/severity: "High"
    security.kubeapt.io/remediation: "Replace 0.0.0.0/0 and ::/0 in Allow egress rules with the specific destination CIDRs the selected endpoints actually need. Field: spec.egress[*].destination.nets."
    security.kubeapt.io/product: "Calico"
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
    - apiGroups:
      - crd.projectcalico.org
      apiVersions:
      - v1
      operations:
      - CREATE
      - UPDATE
      resources:
      - networkpolicies
  validations:
  - expression: |
      !object.spec.?egress.orValue([]).exists(r,
        r.?action.orValue('') == 'Allow' &&
        r.?destination.nets.orValue([]).exists(n, n == '0.0.0.0/0' || n == '::/0')
      )
    message: |
      Calico NetworkPolicies must not Allow egress to 0.0.0.0/0 or ::/0.
