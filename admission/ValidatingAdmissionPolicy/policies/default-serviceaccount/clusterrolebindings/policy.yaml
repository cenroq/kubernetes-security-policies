apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: clusterrolebinding-default-serviceaccount
  annotations:
    kubeapt.io/uuid: "e56cfce0-5f49-429b-b31e-06796251a1cd"
    security.kubeapt.io/displayName: "Binds a Privileged Role to the Default ServiceAccount"
    security.kubeapt.io/description: "Every pod that names no ServiceAccount runs as default, so a ClusterRoleBinding to it spreads cluster-wide permissions across unrelated workloads in that namespace and any single compromised container inherits them immediately."
    security.kubeapt.io/resource: "ClusterRoleBindings"
    security.kubeapt.io/severity: "Moderate"
    security.kubeapt.io/remediation: "Create a dedicated ServiceAccount for the workload, bind the role to that name, and select it from the pods with spec.serviceAccountName. Fields: subjects[*].kind, subjects[*].name."
    security.kubeapt.io/product: "Kubernetes"
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
    - apiGroups:
      - rbac.authorization.k8s.io
      apiVersions:
      - v1
      operations:
      - CREATE
      - UPDATE
      resources:
      - clusterrolebindings
  validations:
  - expression: |
      !has(object.subjects) || object.subjects.all(s,
        !(s.kind == "ServiceAccount" && s.name == "default")
      )
    message: |
      Do not bind powerful roles to the default ServiceAccount.
