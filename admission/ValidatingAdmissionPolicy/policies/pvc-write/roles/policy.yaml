apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: role-pvc-write
  annotations:
    security.kubeapt.io/displayName: "Pvc Write"
    security.kubeapt.io/description: "Creating PersistentVolumeClaims in the namespace can bind a volume that still holds data from another workload into an attacker-controlled pod, while delete destroys the backing data and unbounded provisioning exhausts the storage quota."
    security.kubeapt.io/resource: "Roles"
    security.kubeapt.io/severity: "Low"
    security.kubeapt.io/remediation: "Remove create, update, patch and delete from every rule covering persistentvolumeclaims in the core API group, leaving get, list and watch where a workload only needs to inspect them. Fields: rules[*].apiGroups, rules[*].resources, rules[*].verbs."
    security.kubeapt.io/product: "Kubernetes"
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
    - apiGroups:
      - rbac.authorization.k8s.io
      apiVersions:
      - v1
      operations:
      - CREATE
      - UPDATE
      resources:
      - roles
  validations:
  - expression: |
      !has(object.rules) || object.rules.all(r,
        !(r.apiGroups.exists(ag, ag == "") &&
          r.resources.exists(res, res == "persistentvolumeclaims") &&
          r.verbs.exists(v, v in ["create","update","patch","delete"]))
      )
    message: |
      Roles must not grant create/update/patch/delete on PersistentVolumeClaims without tight controls.
