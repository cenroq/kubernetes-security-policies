apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: livenessprobe-httpget-host-initcontainers
  annotations:
    security.kubeapt.io/displayName: "Livenessprobe Httpget Host"
    security.kubeapt.io/description: "Redirecting the liveness HTTP probe to another host makes the kubelet fetch an arbitrary URL from the node, reaching metadata and node-local endpoints closed to pods, while a hung init container is never restarted."
    security.kubeapt.io/resource: "Initcontainers"
    security.kubeapt.io/severity: "Low"
    security.kubeapt.io/remediation: "Remove the host field so the probe targets the pod IP, or set it to an empty string. Field: spec.initContainers[*].livenessProbe.httpGet.host."
    security.kubeapt.io/product: "Kubernetes"
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
    - apiGroups:
      - ''
      apiVersions:
      - v1
      operations:
      - CREATE
      - UPDATE
      resources:
      - pods
  validations:
  - expression: |
      !has(object.spec.initContainers) || object.spec.initContainers.all(ic,
        !has(ic.livenessProbe) ||
        !has(ic.livenessProbe.httpGet) ||
        !has(ic.livenessProbe.httpGet.host) ||
        ic.livenessProbe.httpGet.host == ""
      )
    message: |
      spec.initContainers[*].livenessProbe.httpGet.host must be undefined or empty ("").
