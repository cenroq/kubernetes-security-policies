apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: selinux-user
  annotations:
    security.kubeapt.io/displayName: "Selinux User"
    security.kubeapt.io/description: "A custom SELinux user label at pod level replaces the confined context the runtime assigns to every container, granting a policy domain with transitions and file access the sandbox was never meant to allow."
    security.kubeapt.io/resource: "Pods"
    security.kubeapt.io/severity: "Moderate"
    security.kubeapt.io/remediation: "Remove the pod-level seLinuxOptions.user setting or leave it as an empty string so the runtime assigns its default SELinux user. Field: spec.securityContext.seLinuxOptions.user."
    security.kubeapt.io/product: "Kubernetes"
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
    - apiGroups:
      - ''
      apiVersions:
      - v1
      operations:
      - CREATE
      - UPDATE
      resources:
      - pods
  validations:
  - expression: |
      !has(object.spec.securityContext) || !has(object.spec.securityContext.seLinuxOptions) || !has(object.spec.securityContext.seLinuxOptions.user) || object.spec.securityContext.seLinuxOptions.user == ""
    message: |
      spec.securityContext.seLinuxOptions.user must be undefined or an empty string ("").
