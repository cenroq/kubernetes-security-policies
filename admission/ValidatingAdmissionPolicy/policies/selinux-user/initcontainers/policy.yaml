apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: selinux-user-initcontainers
  annotations:
    security.kubeapt.io/displayName: "Selinux User"
    security.kubeapt.io/description: "A custom SELinux user label replaces the confined context the runtime assigns to the init container, granting a policy domain with transitions and file access the sandbox was never meant to allow."
    security.kubeapt.io/resource: "Initcontainers"
    security.kubeapt.io/severity: "Moderate"
    security.kubeapt.io/remediation: "Remove the seLinuxOptions.user setting from every init container or leave it as an empty string so the runtime assigns its default SELinux user. Field: spec.initContainers[*].securityContext.seLinuxOptions.user."
    security.kubeapt.io/product: "Kubernetes"
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
    - apiGroups:
      - ''
      apiVersions:
      - v1
      operations:
      - CREATE
      - UPDATE
      resources:
      - pods
  validations:
  - expression: |
      !has(object.spec.initContainers) || object.spec.initContainers.all(ic,
        !has(ic.securityContext) ||
        !has(ic.securityContext.seLinuxOptions) ||
        !has(ic.securityContext.seLinuxOptions.user) ||
        ic.securityContext.seLinuxOptions.user == ""
      )
    message: |
      spec.initContainers[*].securityContext.seLinuxOptions.user must be undefined or an empty string ("").
