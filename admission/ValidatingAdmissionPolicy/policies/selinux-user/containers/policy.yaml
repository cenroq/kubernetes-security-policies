apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: selinux-user-containers
  annotations:
    security.kubeapt.io/displayName: "Selinux User"
    security.kubeapt.io/description: "A custom SELinux user label replaces the confined context the runtime assigns to the container, granting a policy domain with transitions and file access the sandbox was never meant to allow."
    security.kubeapt.io/resource: "Containers"
    security.kubeapt.io/severity: "Moderate"
    security.kubeapt.io/remediation: "Remove the seLinuxOptions.user setting from every container or leave it as an empty string so the runtime assigns its default SELinux user. Field: spec.containers[*].securityContext.seLinuxOptions.user."
    security.kubeapt.io/product: "Kubernetes"
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
    - apiGroups:
      - ''
      apiVersions:
      - v1
      operations:
      - CREATE
      - UPDATE
      resources:
      - pods
  validations:
  - expression: |
      object.spec.containers.all(c,
        !has(c.securityContext) ||
        !has(c.securityContext.seLinuxOptions) ||
        !has(c.securityContext.seLinuxOptions.user) ||
        c.securityContext.seLinuxOptions.user == ""
      )
    message: |
      spec.containers[*].securityContext.seLinuxOptions.user must be undefined or an empty string ("").
