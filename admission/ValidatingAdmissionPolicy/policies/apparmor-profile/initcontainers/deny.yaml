apiVersion: v1
kind: Pod
metadata:
  name: apparmor-profile-initcontainers
  annotations:
    kubeapt.io/uuid: "52a53ccc-78d2-4650-b761-ba691fe4d9cd"
spec:
  containers:
  - name: main
    image: busybox:1.36
    command:
    - sh
    - -c
    - sleep 3600
  initContainers:
  - name: init
    image: busybox:1.36
    command:
    - sh
    - -c
    - echo init
    securityContext:
      appArmorProfile:
        type: Unconfined
