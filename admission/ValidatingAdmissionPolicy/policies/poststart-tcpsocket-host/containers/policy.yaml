apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: container-poststart-tcpsocket-host
  annotations:
    kubeapt.io/uuid: "11bc67f9-eb75-45b1-a5a2-9df6049e98dd"
    security.kubeapt.io/displayName: "postStart TCP Hook Targets an Arbitrary Host"
    security.kubeapt.io/description: "Naming another host in a postStart TCP hook points container start at an off-pod address through a handler the kubelet does not support, so the hook fails and the container is killed."
    security.kubeapt.io/resource: "Containers"
    security.kubeapt.io/severity: "Low"
    security.kubeapt.io/remediation: "Remove the host field or set it to an empty string, and prefer an exec or httpGet handler since tcpSocket hooks are unsupported. Field: spec.containers[*].lifecycle.postStart.tcpSocket.host."
    security.kubeapt.io/product: "Kubernetes"
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
    - apiGroups:
      - ''
      apiVersions:
      - v1
      operations:
      - CREATE
      - UPDATE
      resources:
      - pods
  validations:
  - expression: |
      object.spec.containers.all(c,
        !has(c.lifecycle) ||
        !has(c.lifecycle.postStart) ||
        !has(c.lifecycle.postStart.tcpSocket) ||
        !has(c.lifecycle.postStart.tcpSocket.host) ||
        c.lifecycle.postStart.tcpSocket.host == ""
      )
    message: |
      spec.containers[*].lifecycle.postStart.tcpSocket.host must be undefined or empty ("").
