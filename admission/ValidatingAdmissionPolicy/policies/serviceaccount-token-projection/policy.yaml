apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: pod-serviceaccount-token-projection
  annotations:
    kubeapt.io/uuid: "a41bf199-ff1b-450c-8a31-d924a6089451"
    security.kubeapt.io/displayName: "Mounts an Unprojected ServiceAccount Token"
    security.kubeapt.io/description: "A pod that names a ServiceAccount but declares no projected token volume gets the cluster default mount, so a token copied out of its filesystem carries a broad audience and a lifetime nobody pinned."
    security.kubeapt.io/resource: "Pods"
    security.kubeapt.io/severity: "Low"
    security.kubeapt.io/remediation: "Add a projected volume whose sources include a serviceAccountToken entry, or set spec.automountServiceAccountToken to false when the pod never calls the Kubernetes API. Fields: spec.volumes[*].projected.sources[*].serviceAccountToken, spec.automountServiceAccountToken."
    security.kubeapt.io/product: "Kubernetes"
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
    - apiGroups:
      - ''
      apiVersions:
      - v1
      operations:
      - CREATE
      - UPDATE
      resources:
      - pods
  validations:
  - expression: |
      !has(object.spec.serviceAccountName) ||
      (has(object.spec.automountServiceAccountToken) && object.spec.automountServiceAccountToken == false) ||
      (has(object.spec.volumes) &&
       object.spec.volumes.exists(v,
         has(v.projected) &&
         has(v.projected.sources) &&
         v.projected.sources.exists(s, has(s.serviceAccountToken))
       ))
    message: |
      Pods using a serviceAccountName must include a projected serviceAccountToken volume, or set spec.automountServiceAccountToken=false.
