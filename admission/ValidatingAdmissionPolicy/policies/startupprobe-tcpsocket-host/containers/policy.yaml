apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: container-startupprobe-tcpsocket-host
  annotations:
    kubeapt.io/uuid: "1a8a155a-af40-4718-bf9e-0941fafe0da0"
    security.kubeapt.io/displayName: "Startup TCP Probe Targets an Arbitrary Host"
    security.kubeapt.io/description: "Pointing the startup TCP probe at another host makes the kubelet open connections from the node to an arbitrary address, probing endpoints closed to pods, and a hung container passes its startup gate."
    security.kubeapt.io/resource: "Containers"
    security.kubeapt.io/severity: "Low"
    security.kubeapt.io/remediation: "Remove the host field so the probe targets the pod IP, or set it to an empty string. Field: spec.containers[*].startupProbe.tcpSocket.host."
    security.kubeapt.io/product: "Kubernetes"
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
    - apiGroups:
      - ''
      apiVersions:
      - v1
      operations:
      - CREATE
      - UPDATE
      resources:
      - pods
  validations:
  - expression: |
      object.spec.containers.all(c,
        !has(c.startupProbe) ||
        !has(c.startupProbe.tcpSocket) ||
        !has(c.startupProbe.tcpSocket.host) ||
        c.startupProbe.tcpSocket.host == ""
      )
    message: |
      spec.containers[*].startupProbe.tcpSocket.host must be undefined or empty ("").
