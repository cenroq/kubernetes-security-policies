apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: persistentvolume-hostpath
  annotations:
    security.kubeapt.io/displayName: "PersistentVolume HostPath"
    security.kubeapt.io/description: "A hostPath or local PersistentVolume hands pods a path on the node filesystem, so any workload that binds the claim can read or tamper with kubelet credentials and other tenants' data."
    security.kubeapt.io/resource: "PersistentVolumes"
    security.kubeapt.io/severity: "High"
    security.kubeapt.io/remediation: "Back the volume with a CSI or network storage source and remove the node-local source. Fields: spec.hostPath, spec.local."
    security.kubeapt.io/product: "Kubernetes"
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
    - apiGroups:
      - ''
      apiVersions:
      - v1
      operations:
      - CREATE
      - UPDATE
      resources:
      - persistentvolumes
  validations:
  - expression: |
      !has(object.spec.hostPath) && !has(object.spec.local)
    message: |
      PersistentVolumes must not be backed by a node-local hostPath or local volume.
