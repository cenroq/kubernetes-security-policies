apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: initcontainer-livenessprobe-tcpsocket-host
  annotations:
    cenroq.io/finding: "oq-0361"
    cenroq.io/kubernetes-version-min: "1.29"
    security.kubeapt.io/displayName: "Liveness TCP Probe Targets an Arbitrary Host"
    security.kubeapt.io/description: "Pointing the liveness TCP probe at another host makes the kubelet open connections from the node to an arbitrary address, probing endpoints closed to pods, while a hung init container is never restarted."
    security.kubeapt.io/resource: "InitContainers"
    security.kubeapt.io/severity: "Low"
    security.kubeapt.io/remediation: "Remove the host field so the probe targets the pod IP, or set it to an empty string. Field: spec.initContainers[*].livenessProbe.tcpSocket.host."
    security.kubeapt.io/product: "Kubernetes"
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
    - apiGroups:
      - ''
      apiVersions:
      - v1
      operations:
      - CREATE
      - UPDATE
      resources:
      - pods
  validations:
  - expression: |
      !has(object.spec.initContainers) || object.spec.initContainers.all(ic,
        !has(ic.livenessProbe) ||
        !has(ic.livenessProbe.tcpSocket) ||
        !has(ic.livenessProbe.tcpSocket.host) ||
        ic.livenessProbe.tcpSocket.host == ""
      )
    message: |
      spec.initContainers[*].livenessProbe.tcpSocket.host must be undefined or empty ("").
