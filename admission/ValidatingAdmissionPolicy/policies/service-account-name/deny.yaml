apiVersion: v1
kind: Pod
metadata:
  name: violating-service-account-name
  annotations:
    kubeapt.io/uuid: "1e4e5442-122f-4dd9-86ce-a6104971b13b"
  labels:
    app: good
spec:
  serviceAccountName: default
  automountServiceAccountToken: false
  volumes:
  - name: sa-token
    projected:
      sources:
      - serviceAccountToken:
          path: token
  containers:
  - name: main
    image: busybox:1.36
    command: ["sh", "-c", "sleep 3600"]
    volumeMounts:
    - name: sa-token
      mountPath: /var/run/secrets/sa-token
